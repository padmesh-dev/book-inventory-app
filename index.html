<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Book Inventory</h1>
    <p class="subtitle">Manage and track your book collection</p>

    <section class="inventory">

      <div class="book available">
        <h2>The Alchemist</h2>
        <p>Author: Paulo Coelho</p>
        <span>Status: Available</span>
      </div>

      <div class="book issued">
        <h2>Atomic Habits</h2>
        <p>Author: James Clear</p>
        <span>Status: Issued</span>
      </div>

      <div class="book available">
        <h2>Clean Code</h2>
        <p>Author: Robert C. Martin</p>
        <span>Status: Available</span>
      </div>

      <div class="book issued">
        <h2>Think Like a Monk</h2>
        <p>Author: Jay Shetty</p>
        <span>Status: Issued</span>
      </div>

    </section>
  </main>

</body>
</html>
